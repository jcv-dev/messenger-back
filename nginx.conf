upstream backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 50M;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    # Django admin static files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Internal media — served via X-Accel-Redirect from Django (auth-protected)
    location /internal-media/ {
        alias /app/media/;
        internal;
        add_header Cache-Control "private, max-age=86400, immutable";
    }

    # SSE endpoint — long-lived streaming, no buffering
    location /api/events/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # All API and auth routes
    location ~ ^/(api|api-auth|webhook|manage)/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Health check
    location /health {
        access_log off;
        return 200 "ok";
    }

    # Catch-all — reject undefined paths
    location / {
        return 404;
    }
}
