[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

[program:uvicorn]
command=uvicorn config.asgi:application --host 127.0.0.1 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips '*' --limit-max-requests 1000 --limit-max-requests-jitter 200 --timeout-keep-alive 30 --backlog 100 --limit-concurrency 50
directory=/app
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bot]
command=python manage.py run_bot
directory=/app
user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=10
exitcodes=0,2
stopwaitsecs=30
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
